<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catur 7MIT</title>
<meta name="theme-color" content="#1b1d27">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- MENU UTAMA -->
  <section id="screen-menu" class="screen active">
    <div class="logo"><i data-icon="chess-knight"></i></div>
    <h1>Catur 7MIT</h1>
    <p class="sub">Main sendiri, berdua satu perangkat, atau online.</p>
    <div class="menu">
      <button class="big" data-go="single"><span><i data-icon="bot"></i></span> Lawan Komputer<small>Single player, 4 tingkat kesulitan</small></button>
      <button class="big" data-go="local"><span><i data-icon="users"></i></span> 2 Pemain (Lokal)<small>Satu perangkat, gantian</small></button>
      <button class="big" data-go="online"><span><i data-icon="globe"></i></span> Multiplayer Online<small>Server 7MIT · buat / pilih server / otomatis</small></button>
    </div>
  </section>

  <!-- PENGATURAN SINGLE -->
  <section id="screen-single" class="screen">
    <header class="bar"><button class="back" data-go="menu"><i data-icon="chevron-left"></i> Kembali</button><h2>Lawan Komputer</h2></header>
    <div class="card">
      <label>Tingkat kesulitan</label>
      <div class="seg" id="seg-level">
        <button data-v="1">Pemula</button><button data-v="2" class="on">Mudah</button>
        <button data-v="3">Sedang</button><button data-v="4">Sulit</button>
      </div>
      <label>Warna kamu</label>
      <div class="seg" id="seg-color">
        <button data-v="w" class="on">♔ Putih</button><button data-v="r"><i data-icon="dices"></i> Acak</button><button data-v="b">♚ Hitam</button>
      </div>
      <button class="primary" id="btn-start-single">Mulai Main</button>
    </div>
  </section>

  <!-- ONLINE -->
  <section id="screen-online" class="screen">
    <header class="bar"><button class="back" data-go="menu"><i data-icon="chevron-left"></i> Kembali</button><h2>Multiplayer Online</h2><span id="net-status" class="pill">server.7mit</span></header>
    <div class="card">
      <label for="inp-name">Nama kamu</label>
      <input id="inp-name" maxlength="20" placeholder="Nama pemain" autocomplete="nickname">
      <label>Kontrol waktu (menit | tambahan detik)</label>
      <div class="seg wrap" id="seg-tc">
        <button data-v="0,0">Tanpa jam</button><button data-v="180,2">3|2</button><button data-v="300,0" class="on">5|0</button>
        <button data-v="600,0">10|0</button><button data-v="900,10">15|10</button>
      </div>
      <button class="primary" id="btn-auto"><i data-icon="zap"></i> Cari Lawan Otomatis (PvP)</button>
    </div>
    <div class="card">
      <h3>Buat Server</h3>
      <input id="inp-room" maxlength="30" placeholder="Nama server (opsional)">
      <div class="seg" id="seg-ocolor">
        <button data-v="w">♔ Putih</button><button data-v="r" class="on"><i data-icon="dices"></i> Acak</button><button data-v="b">♚ Hitam</button>
      </div>
      <label class="check"><input type="checkbox" id="chk-public" checked> Tampilkan di daftar server (publik)</label>
      <button class="secondary" id="btn-create">Buat Server</button>
    </div>
    <div class="card">
      <div class="row"><h3>Pilih Server</h3><button class="mini" id="btn-refresh" aria-label="Segarkan"><i data-icon="refresh-cw"></i></button></div>
      <div id="room-list" class="rooms"><div class="empty">Memuat…</div></div>
      <div class="join-code">
        <input id="inp-code" maxlength="5" placeholder="Kode server" style="text-transform:uppercase">
        <button class="secondary" id="btn-join-code">Gabung</button>
      </div>
    </div>
  </section>

  <!-- MENUNGGU LAWAN -->
  <section id="screen-wait" class="screen">
    <div class="center-card">
      <div class="spinner"></div>
      <h2 id="wait-title">Menunggu lawan…</h2>
      <p id="wait-sub" class="sub"></p>
      <div id="wait-code" class="code"></div>
      <button class="secondary" id="btn-wait-cancel">Batal</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <header class="bar">
      <button class="back" id="btn-leave"><i data-icon="chevron-left"></i> Menu</button>
      <h2 id="game-title">Catur</h2>
      <span id="game-conn" class="pill hidden"></span>
    </header>
    <div class="game">
      <div class="boardwrap">
        <div class="player top" id="pl-top"><span class="pname"></span><span class="captured"></span><span class="clock hidden"></span></div>
        <div id="board" class="board" aria-label="Papan catur"></div>
        <div class="player bottom" id="pl-bottom"><span class="pname"></span><span class="captured"></span><span class="clock hidden"></span></div>
      </div>
      <aside class="side">
        <div id="status" class="status">Giliran Putih</div>
        <div id="moves" class="moves"></div>
        <div class="actions">
          <button id="btn-undo"><i data-icon="undo-2"></i> Undo</button>
          <button id="btn-flip"><i data-icon="arrow-up-down"></i> Putar</button>
          <button id="btn-draw" class="hidden"><i data-icon="handshake"></i> Remis</button>
          <button id="btn-resign" class="hidden danger"><i data-icon="flag"></i> Menyerah</button>
          <button id="btn-claim" class="hidden"><i data-icon="trophy"></i> Klaim Menang</button>
          <button id="btn-new"><i data-icon="rotate-ccw"></i> Baru</button>
        </div>
        <div id="draw-offer" class="offer hidden">Lawan menawarkan remis
          <span><button id="btn-draw-yes">Terima</button><button id="btn-draw-no">Tolak</button></span></div>
      </aside>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="js/icons.js"></script>
<script src="js/chess.js"></script>
<script src="js/ai.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
</body>
</html>
